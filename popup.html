<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Resume Quick Apply</title>
<style>
  body{font-family:Arial,sans-serif;width:330px;margin:0;padding:18px;color:#24313d}
  h1{font-size:18px;margin:0 0 2px}.version{font-size:11px;font-weight:700;color:#18747a}
  #source,#state{font-size:13px;margin:12px 0;color:#5f6c75;line-height:1.4}
  button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}
  #settings{background:#24313d;color:#fff;width:100%}
  #stop{background:#eef2f4;color:#24313d;width:100%;margin-top:8px}
</style>
</head>
<body>
<h1>Resume Quick Apply</h1>
<div class="version">PER-PAGE 0.6.3</div>
<div id="source">Checking résumé source…</div>
<div id="state">Each application page will ask before autofilling.</div>
<button id="settings">Résumé & profile settings</button>
<button id="stop">Stop autofill on this page</button>
<script src="popup.js"></script>
</body>
</html>
