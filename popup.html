<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Resume Quick Apply</title>
<style>
  body{font-family:Arial,sans-serif;width:330px;margin:0;padding:18px;color:#24313d;background:#fff}
  h1{font-size:19px;margin:0 0 2px}.version{font-size:11px;font-weight:700;color:#18747a}
  #source{font-size:12px;margin:12px 0 6px;color:#66727c;line-height:1.4}
  #state{font-size:13px;margin:10px 0 14px;padding:10px 12px;border-radius:8px;background:#f2f5f6;color:#52606a;line-height:1.4}
  #state.active{background:#edf8f5;color:#166d60;font-weight:700}
  button{border:0;border-radius:8px;padding:11px 12px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
  button:disabled{cursor:default;opacity:.45}
  #start{background:#24313d;color:#fff}
  #autofill{background:#18747a;color:#fff}
  #finish{background:#f6ecec;color:#8e2828}
  #settings{background:#edf2f4;color:#24313d;margin-top:14px}
  .hint{font-size:11px;color:#7a858d;line-height:1.4;margin-top:10px}
</style>
</head>
<body>
<h1>Resume Quick Apply</h1>
<div class="version">APPLICATION SESSION 0.6.6</div>
<div id="source">Checking résumé source…</div>
<div id="state">Application mode is off for this tab.</div>
<button id="start">Start Application</button>
<button id="autofill" disabled>Autofill Page</button>
<button id="finish" disabled>Finish Application</button>
<button id="settings">Profile & Settings</button>
<div class="hint">Start once on the application tab. Use Autofill Page on each page you want filled. You still review and navigate the employer site yourself.</div>
<script src="popup.js"></script>
</body>
</html>
